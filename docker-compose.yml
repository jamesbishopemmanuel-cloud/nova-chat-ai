services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nova
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./server:/app
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://nova:nova_dev_password@db:5432/nova
      CLIENT_ORIGIN: http://localhost:5173
    depends_on:
      - db
    command: sh -c "npm install && npm run dev"

  client:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./client:/app
    ports:
      - "5173:5173"
    depends_on:
      - server
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  pgdata:
